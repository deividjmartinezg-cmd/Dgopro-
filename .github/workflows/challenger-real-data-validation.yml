name: Validate DGOPRO challenger on real data
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/challenger-real-data-validation.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      historical_data_path:
        description: 'Optional existing path in runner containing data/raw/footballcsv/*.csv (normally unavailable on hosted runners)'
        required: false
        default: ''
concurrency:
  group: dgopro-challenger-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DGOPRO challenger
        uses: actions/checkout@v4
        with:
          ref: challenger/dgopro-3
      - name: Record challenger revision
        run: |
          echo "Challenger revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%h %s'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Check real-data availability
        id: data
        env:
          DATA_PATH: ${{ inputs.historical_data_path }}
        run: |
          if [ -n "$DATA_PATH" ] && [ -d "$DATA_PATH/data/raw/footballcsv" ] && find "$DATA_PATH/data/raw/footballcsv" -type f -name '*.csv' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=$DATA_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Historical validation NOT EXECUTED: no verified historical CSV dataset. VMD-World1 is not checked out or simulated."
            echo "Historical validation: NOT EXECUTED (missing historical CSV dataset)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Real historical validation
        if: steps.data.outputs.available == 'true'
        env:
          PYTHONPATH: src
          DATA_ROOT: ${{ steps.data.outputs.root }}
        run: python scripts/validate_real_data.py "$DATA_ROOT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.data.outputs.available == 'true'
        with:
          name: dgopro-real-data-validation
          path: artifacts/real_data_validation.json
          if-no-files-found: error

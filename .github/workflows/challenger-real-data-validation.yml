name: Validate DGOPRO challenger on real data
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DGOPRO challenger
        uses: actions/checkout@v4
        with:
          ref: challenger/dgopro-3
      - name: Checkout VMD World
        uses: actions/checkout@v4
        with:
          repository: deividjmartinezg-cmd/VMD-World
          path: VMD-World
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Real historical validation
        env:
          PYTHONPATH: src
        run: python scripts/validate_real_data.py VMD-World
      - uses: actions/upload-artifact@v4
        with:
          name: dgopro-real-data-validation
          path: artifacts/real_data_validation.json

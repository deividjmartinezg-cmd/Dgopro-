name: DGOPRO independent validation
on:
  push:
    branches: [challenger/dgopro-3]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/real-data-validation.yml'
  workflow_dispatch:
concurrency:
  group: dgopro-independent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DGOPRO
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run independent unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Historical data readiness
        id: data
        run: |
          if [ -d "data/raw/footballcsv" ] && find data/raw/footballcsv -type f -name '*.csv' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Historical backtest NOT EXECUTED: no verified footballcsv dataset in DGOPRO. VMD is not required."
            echo "Historical backtest: NOT EXECUTED (missing verified dataset)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate historical data independently
        if: steps.data.outputs.available == 'true'
        env:
          PYTHONPATH: src
        run: python scripts/validate_real_data.py .
      - name: Upload validation report
        if: steps.data.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dgopro-independent-real-data-validation
          path: artifacts/real_data_validation.json
          if-no-files-found: error
